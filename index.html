<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matek gyakorló – 3. osztály</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;800&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fdfdfb; --grid:#d8e7f4; --ink:#1d3c8f; --ink-soft:#5a6c9a;
  --red:#d62828; --hl:#ffe36b; --pencil:#5d6675; --chip:#e8f1fa; --ok:#1e8a4c;
  --cell:26px;
  --ui:'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  --hand:'Patrick Hand', 'Comic Sans MS', 'Segoe Print', cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111a30; --grid:#1d2b4b; --ink:#dbe5ff; --ink-soft:#9fb0d8;
    --red:#ff6b6b; --hl:#7a6200; --pencil:#9aa4b5; --chip:#1b2846; --ok:#5fd394;
  }
}
:root[data-theme="dark"]{
  --paper:#111a30; --grid:#1d2b4b; --ink:#dbe5ff; --ink-soft:#9fb0d8;
  --red:#ff6b6b; --hl:#7a6200; --pencil:#9aa4b5; --chip:#1b2846; --ok:#5fd394;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; color:var(--ink); font-family:var(--ui); font-size:18px; line-height:1.45;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:var(--cell) var(--cell);
  padding-bottom:110px;
}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px}
header h1{font-weight:800;font-size:clamp(34px,8vw,48px);line-height:1.05;margin:12px 0 4px;letter-spacing:-.5px}
header p{margin:0 0 18px;color:var(--ink-soft);font-size:17px}
.panel{background:color-mix(in srgb,var(--paper) 88%,transparent);border:2px solid var(--grid);border-radius:14px;padding:14px;margin-bottom:22px}
.panel h2{font-size:16px;font-weight:600;margin:0 0 8px;color:var(--ink-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{font:inherit;font-size:16px;font-weight:600;color:var(--ink);background:transparent;border:2px solid var(--grid);border-radius:999px;padding:4px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--chip);border-color:var(--ink)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:10px;overflow:hidden}
.seg button{font:inherit;font-weight:600;color:var(--ink);background:transparent;border:0;padding:4px 16px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.btn{font:inherit;font-weight:800;font-size:18px;border-radius:12px;padding:8px 20px;cursor:pointer;border:2px solid var(--ink);background:var(--ink);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.warn{color:var(--red);font-weight:600;font-size:16px;margin:8px 0 0;min-height:1em}

.topic{font-size:20px;font-weight:800;margin:28px 0 6px;padding-bottom:2px;border-bottom:3px solid var(--ink);display:inline-block}
.prob{position:relative;display:grid;grid-template-columns:2.2em 1fr;gap:4px;padding:10px 46px 10px 0}
.num{font-weight:800;font-size:18px;color:var(--ink-soft);padding-top:2px}
.q{margin:0 0 6px;font-weight:500}
.q .w{font-style:normal;font-weight:600;background:var(--hl);padding:0 4px;border-radius:4px}
.q .big{font-family:var(--hand);font-size:28px;letter-spacing:2px;margin-left:6px}
.q mark{background:var(--hl);color:inherit;border-bottom:3px solid var(--ink);padding:0 2px}
.line{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:20px;font-weight:600}
.line .t{white-space:nowrap}
input.a{
  font-family:var(--hand);font-size:26px;color:var(--ink);width:4.6em;padding:0 6px;height:40px;
  background:color-mix(in srgb,var(--paper) 80%,transparent);
  border:0;border-bottom:2.5px dashed var(--ink-soft);border-radius:4px 4px 0 0;text-align:center
}
input.a.roman{width:6.5em;text-transform:uppercase}
input.a:focus{border-bottom-style:solid;border-bottom-color:var(--ink);outline:none;background:var(--chip)}
input.a:disabled{opacity:1;-webkit-text-fill-color:var(--ink)}
.cmp{display:inline-flex;gap:6px}
.cmp button{font-family:var(--hand);font-size:26px;width:44px;height:44px;border-radius:10px;border:2px dashed var(--ink-soft);background:transparent;color:var(--ink);cursor:pointer;line-height:1}
.cmp button[aria-pressed="true"]{border-style:solid;border-color:var(--ink);background:var(--chip)}
.cmp button:disabled{cursor:default}

.col{display:inline-grid;font-family:var(--hand);font-size:28px;margin:4px 0 2px}
.col .r{display:grid;grid-auto-flow:column;justify-content:end}
.col .c{width:30px;height:34px;display:flex;align-items:center;justify-content:center}
.col .r.under{border-bottom:3px solid var(--ink)}
.col input.a{width:100%;text-align:right;letter-spacing:13px;padding-right:0;margin-top:2px}

svg.shape{display:block;margin:2px 0 6px;color:var(--ink);max-width:100%}
.mark{position:absolute;right:4px;top:4px;font-family:var(--hand);font-size:44px;line-height:1;color:var(--red);transform:rotate(-8deg)}
.mark.ok{color:var(--red)}
.fix{font-family:var(--hand);font-size:22px;color:var(--red);margin-top:4px}

.result{display:none;align-items:center;gap:18px;margin:6px 0 10px;padding:14px;border:2px solid var(--red);border-radius:14px;background:color-mix(in srgb,var(--paper) 90%,transparent)}
.result.show{display:flex}
.grade{position:relative;width:96px;height:96px;flex:none;color:var(--red)}
.grade span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--hand);font-size:62px;line-height:1}
.result h2{margin:0;font-size:24px;font-weight:800;color:var(--red)}
.result p{margin:2px 0 10px;color:var(--ink)}
.stats{color:var(--ink-soft);font-size:15px;margin-top:24px}

.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--paper) 94%,transparent);border-top:2px solid var(--grid);display:flex;justify-content:center;gap:10px}
.bar .btn{width:min(420px,100%)}
@media (prefers-reduced-motion: no-preference){ .mark{animation:pop .25s ease-out} @keyframes pop{from{transform:rotate(-8deg) scale(1.6);opacity:0}} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Matek gyakorló</h1>
    <p>Ismétlés a 3. osztályos anyagból. Minden lap új feladatokat ad.</p>
  </header>

  <section class="panel" aria-label="Beállítások">
    <h2>Témák</h2>
    <div class="chips" id="chips"></div>
    <h2>Feladatok száma</h2>
    <div class="row">
      <div class="seg" id="seg">
        <button data-n="10" aria-pressed="false">10</button>
        <button data-n="15" aria-pressed="true">15</button>
        <button data-n="20" aria-pressed="false">20</button>
      </div>
      <button class="btn ghost" id="newBtn">Új feladatlap</button>
    </div>
    <p class="warn" id="topicWarn"></p>
  </section>

  <div class="result" id="result" aria-live="polite">
    <div class="grade" aria-hidden="true">
      <svg viewBox="0 0 100 100" width="96" height="96"><path d="M52 8 C78 6 94 26 92 52 C90 80 66 94 44 91 C18 88 6 66 9 44 C12 22 30 9 55 12" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>
      <span id="gradeNum">5</span>
    </div>
    <div>
      <h2 id="resTitle"></h2>
      <p id="resText"></p>
      <button class="btn" id="againBtn">Új feladatlap</button>
    </div>
  </div>

  <main id="sheet"></main>
  <p class="stats" id="stats"></p>
</div>

<div class="bar">
  <button class="btn" id="checkBtn">Kész vagyok, javítsuk!</button>
</div>

<script>
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const P=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const F=(ans,o={})=>Object.assign({ans,kind:typeof ans==='string'?'text':'num'},o);

const ONES=['','egy','kettő','három','négy','öt','hat','hét','nyolc','kilenc'];
const HPRE=['','','két','három','négy','öt','hat','hét','nyolc','kilenc'];
const TENS=['','tíz','húsz','harminc','negyven','ötven','hatvan','hetven','nyolcvan','kilencven'];
const TPRE=['','tizen','huszon','harminc','negyven','ötven','hatvan','hetven','nyolcvan','kilencven'];
function hu(n){if(n===1000)return'ezer';const h=Math.floor(n/100),r=n%100,t=Math.floor(r/10),o=r%10;let s=h?(h===1?'száz':HPRE[h]+'száz'):'';s+=t?(o?TPRE[t]+ONES[o]:TENS[t]):ONES[o];return s}
const art=n=>(n===1||n===1000||String(n)[0]==='5')?'az':'a';
function roman(n){const v=[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];let s='';for(const[a,r]of v)while(n>=a){s+=r;n-=a}return s}
const NAMES=['Anna','Bence','Lili','Marci','Zsófi','Dávid','Panni','Gergő','Luca','Áron','Hanna','Levente'];

function rectSvg(a,b){const sc=120/Math.max(a,b),w=Math.max(24,a*sc),h=Math.max(20,b*sc);
  return `<svg class="shape" width="${w+90}" height="${h+40}" viewBox="0 0 ${w+90} ${h+40}" aria-hidden="true"><rect x="10" y="6" width="${w}" height="${h}" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="${10+w/2}" y="${h+30}" text-anchor="middle" fill="currentColor" font-family="Patrick Hand,cursive" font-size="20">${a} cm</text><text x="${w+18}" y="${6+h/2+6}" fill="currentColor" font-family="Patrick Hand,cursive" font-size="20">${b} cm</text></svg>`}

const TOPICS={
  szamok:'Számok 1000-ig', kerekites:'Kerekítés', osszead:'Összeadás, kivonás', szorzas:'Szorzás, osztás',
  irasbeli:'Írásbeli műveletek', mertek:'Mértékegységek', geometria:'Kerület', tortek:'Törtrészek',
  romai:'Római számok', szoveges:'Szöveges feladatok'
};

const G={
 szamok:[
  ()=>{const n=R(101,999);return{q:`Írd le számjegyekkel: <em class="w">${hu(n)}</em>`,f:[F(n)]}},
  ()=>{const h=R(1,9),t=R(0,9),o=R(0,9);const p=shuffle([[h,'százas'],[t,'tízes'],[o,'egyes']]);return{q:'Melyik szám ez?',f:[F(h*100+t*10+o,{pre:p.map(x=>x[0]+' '+x[1]).join(' + ')+' ='})]}},
  ()=>{let n,pos,d;do{n=R(102,998);pos=R(0,2);d=+String(n)[pos]}while(d===0);const s=String(n).split('').map((c,i)=>i===pos?`<mark>${c}</mark>`:c).join('');return{q:`Mennyit ér a kiemelt számjegy? <span class="big">${s}</span>`,f:[F(d*[100,10,1][pos])]}},
  ()=>{let step,s,ok=false;while(!ok){step=P([2,3,4,5,10,20,25,50,100,-2,-3,-5,-10,-20,-25,-50,-100]);s=R(0,1000);if(Math.abs(step)>=20)s=Math.round(s/5)*5;const l=s+4*step;ok=l>=0&&l<=1000&&s<=1000}
       return{q:'Folytasd a sorozatot!',f:[F(s+4*step,{pre:[0,1,2,3].map(k=>s+k*step).join(', ')+','})]}},
  ()=>{const hund=R(0,2)===0;let n;do{n=R(101,989)}while(hund?n%100===0:n%10===0);const u=hund?100:10,lo=Math.floor(n/u)*u;
       return{q:`Írd be a szomszédos ${hund?'százasokat':'tízeseket'}!`,f:[F(lo,{post:`&lt; ${n} &lt;`}),F(lo+u)],sol:`${lo} < ${n} < ${lo+u}`}},
  ()=>{const m=R(0,2);let L,lv,rv;
       if(m===0){lv=R(100,999);rv=R(0,4)===0?lv:Math.min(999,Math.max(100,lv+P([-1,1])*P([1,9,10,90,100])));L=lv}
       else if(m===1){const x=R(100,700),y=R(10,290);lv=x+y;L=`${x} + ${y}`;rv=R(0,3)===0?lv:lv+P([-1,1])*R(1,30)}
       else{const x=R(300,999),y=R(10,290);lv=x-y;L=`${x} − ${y}`;rv=R(0,3)===0?lv:lv+P([-1,1])*R(1,30)}
       return{q:'Tedd ki a jelet!',cmp:{l:L,r:rv},ans:lv<rv?'<':lv>rv?'>':'='}},
 ],
 kerekites:[
  ()=>{let n;do{n=R(101,994)}while(n%10===0);return{q:`Kerekítsd <b>tízesre</b>!`,f:[F(Math.round(n/10)*10,{pre:`${n} ≈`})]}},
  ()=>{let n;do{n=R(101,949)}while(n%100===0);return{q:`Kerekítsd <b>százasra</b>!`,f:[F(Math.round(n/100)*100,{pre:`${n} ≈`})]}},
 ],
 osszead:[
  ()=>{const a=R(100,850),b=R(11,999-a);return{f:[F(a+b,{pre:`${a} + ${b} =`})]}},
  ()=>{const a=R(200,999),b=R(11,a-10);return{f:[F(a-b,{pre:`${a} − ${b} =`})]}},
  ()=>{const c=R(200,1000),b=R(10,c-10);return{q:'Melyik szám hiányzik?',f:[F(c-b,{post:`+ ${b} = ${c}`})]}},
  ()=>{const a=R(200,999),c=R(10,a-10);return{q:'Melyik szám hiányzik?',f:[F(a-c,{pre:`${a} −`,post:`= ${c}`})]}},
  ()=>{const a=R(11,89)*10,b=R(1,Math.floor((1000-a)/10))*10;return R(0,1)?{f:[F(a+b,{pre:`${a} + ${b} =`})]}:{f:[F(a,{pre:`${a+b} − ${b} =`})]}},
  ()=>{const a=R(100,500),b=R(20,300),c=R(10,a+b-10);return{f:[F(a+b-c,{pre:`${a} + ${b} − ${c} =`})]}},
 ],
 szorzas:[
  ()=>{const a=R(2,10),b=R(2,10);return{f:[F(a*b,{pre:`${a} · ${b} =`})]}},
  ()=>{const a=R(2,10),b=R(2,10);return{f:[F(b,{pre:`${a*b} : ${a} =`})]}},
  ()=>{const a=R(2,10),b=R(2,10);return{q:'Melyik szám hiányzik?',f:[F(b,{pre:`${a} ·`,post:`= ${a*b}`})]}},
  ()=>{const a=R(1,9),b=R(2,9);return R(0,1)?{f:[F(a*10*b,{pre:`${a*10} · ${b} =`})]}:{f:[F(a*10,{pre:`${a*10*b} : ${b} =`})]}},
  ()=>{const d=R(2,9),q=R(2,9),r=R(1,d-1),n=d*q+r;return{q:'Oszd el maradékkal!',f:[F(q,{pre:`${n} : ${d} =`}),F(r,{pre:'maradék:'})],sol:`${q}, maradék ${r}`}},
  ()=>{const m=R(0,2);if(m===0){const n=R(2,99);return{f:[F(n*10,{pre:`${n} · 10 =`})]}}if(m===1){const n=R(2,9);return{f:[F(n*100,{pre:`${n} · 100 =`})]}}const n=R(2,99);return{f:[F(n,{pre:`${n*10} : 10 =`})]}},
 ],
 irasbeli:[
  ()=>{let a,b;do{a=R(100,850);b=R(100,999-a)}while(!(a%10+b%10>=10||Math.floor(a/10)%10+Math.floor(b/10)%10>=10));return{q:'Végezd el írásban!',col:{a,b,op:'+'},f:[F(a+b)]}},
  ()=>{let a,b;do{a=R(300,999);b=R(100,a-50)}while(!(a%10<b%10||Math.floor(a/10)%10<Math.floor(b/10)%10));return{q:'Végezd el írásban!',col:{a,b,op:'−'},f:[F(a-b)]}},
  ()=>{const b=R(2,9),a=R(21,Math.floor(999/b));return{q:'Végezd el írásban!',col:{a,b,op:'·'},f:[F(a*b)]}},
 ],
 mertek:(()=>{const U=[['m','cm',100],['dm','cm',10],['m','dm',10],['cm','mm',10],['km','m',1000],['kg','dkg',100],['dkg','g',10],['kg','g',1000],['l','dl',10],['l','cl',100],['l','ml',1000],['dl','cl',10],['cl','ml',10],['óra','perc',60],['perc','másodperc',60],['nap','óra',24],['hét','nap',7],['év','hónap',12]];
  const km=f=>Math.max(1,Math.min(9,Math.floor(1000/f)));
  return[
   ()=>{const[B,s,f]=P(U),k=R(1,km(f));return{q:'Váltsd át!',f:[F(k*f,{pre:`${k} ${B} =`,post:s})]}},
   ()=>{const[B,s,f]=P(U),k=R(2,km(f));return{q:'Váltsd át!',f:[F(k,{pre:`${k*f} ${s} =`,post:B})]}},
   ()=>{let u;do{u=P(U)}while(u[2]>=1000);const[B,s,f]=u,k=R(1,Math.max(1,km(f)-1)),b=R(1,f-1);return{q:'Váltsd át!',f:[F(k*f+b,{pre:`${k} ${B} ${b} ${s} =`,post:s})]}},
  ]})(),
 geometria:[
  ()=>{const a=R(3,15),b=R(2,a-1);return{q:`Mennyi a téglalap kerülete?`,svg:rectSvg(a,b),f:[F(2*(a+b),{pre:'K =',post:'cm'})]}},
  ()=>{const a=R(2,25);return{q:`Egy négyzet oldala ${a} cm. Mennyi a kerülete?`,f:[F(4*a,{pre:'K =',post:'cm'})]}},
  ()=>{const a=R(2,25);return{q:`Egy négyzet kerülete ${4*a} cm. Milyen hosszú egy oldala?`,f:[F(a,{post:'cm'})]}},
  ()=>{const a=R(4,30),b=R(2,a-1);return{q:`Egy téglalap kerülete ${2*(a+b)} cm, az egyik oldala ${a} cm. Milyen hosszú a másik oldala?`,f:[F(b,{post:'cm'})]}},
  ()=>{let a,b,c;do{a=R(3,20);b=R(3,20);c=R(3,20)}while(a+b<=c||a+c<=b||b+c<=a);return{q:`Egy háromszög oldalai ${a} cm, ${b} cm és ${c} cm. Mennyi a kerülete?`,f:[F(a+b+c,{pre:'K =',post:'cm'})]}},
 ],
 tortek:(()=>{const N={2:'fele',3:'harmada',4:'negyede',5:'ötöde',10:'tizede'};return[
  ()=>{const d=P([2,3,4,5,10]),m=R(2,d===2?50:d===10?20:25),n=d*m;return{q:`Mennyi ${art(n)} ${n} ${N[d]}?`,f:[F(m)]}},
  ()=>{const d=P([2,3,4,5,10]),m=R(2,d===10?30:40);return{q:`Minek a ${N[d]} ${m}?`,f:[F(d*m)]}},
 ]})(),
 romai:[
  ()=>{const n=R(0,2)?R(1,100):R(101,1000);return{q:`Írd le római számmal: <span class="big">${n}</span>`,f:[F(roman(n),{roman:true})]}},
  ()=>{const n=R(0,2)?R(1,100):R(101,1000);return{q:`Mennyi ez a szám? <span class="big">${roman(n)}</span>`,f:[F(n)]}},
 ],
 szoveges:[
  ()=>{const N=P(NAMES),a=R(120,600),b=R(20,300);return{q:`${N} gyűjteményében ${a} matrica van. A születésnapjára kap még ${b} matricát. Hány matricája lesz összesen?`,f:[F(a+b,{post:'matrica'})]}},
  ()=>{const a=R(150,500),b=R(40,a-20);return{q:`A pékségben reggel ${a} kifli volt. Délig eladtak ${b} kiflit. Hány kifli maradt?`,f:[F(a-b,{post:'kifli'})]}},
  ()=>{const r=R(3,9),c=R(4,9);return{q:`Egy dobozban ${r} sor tojás van, minden sorban ${c} tojás. Hány tojás van a dobozban?`,f:[F(r*c,{post:'tojás'})]}},
  ()=>{const k=R(2,9),m=R(3,11);return{q:`${k*m} szem cseresznyét egyenlően szétosztunk ${k} gyerek között. Hány szemet kap egy gyerek?`,f:[F(m,{post:'szem'})]}},
  ()=>{let k,p;do{k=R(2,6);p=P([90,110,120,130,140,150])}while(k*p>900);const N=P(NAMES);return{q:`${N} ${k} füzetet vesz, egy füzet ${p} forintba kerül. Mennyit fizet összesen?`,f:[F(k*p,{post:'Ft'})]}},
  ()=>{const a=R(25,60),b=R(5,a-5),c=R(3,30);return{q:`Egy buszon ${a} utas ült. A megállóban leszállt ${b} utas, és felszállt ${c} utas. Hányan utaznak most a buszon?`,f:[F(a-b+c,{post:'utas'})]}},
  ()=>{let N=P(NAMES),M;do{M=P(NAMES)}while(M===N);const a=R(120,450),d=R(15,99);return{q:`${N} ${a} forintot gyűjtött a perselyébe. ${M} ${d} forinttal többet gyűjtött. Mennyit gyűjtöttek ketten együtt?`,f:[F(2*a+d,{post:'Ft'})]}},
  ()=>{const a=R(250,600),b=R(80,a-50);return{q:`Az iskola könyvtárában ${a} mesekönyv és ${b} ismeretterjesztő könyv van. Mennyivel több a mesekönyv?`,f:[F(a-b,{post:'könyvvel'})]}},
  ()=>{const k=R(4,9),q=R(3,9),r=R(1,k-1);return{q:`${k*q+r} szem cukorkát ${k} darabos zacskókba csomagolunk. Hány tele zacskó lesz, és hány szem marad ki?`,f:[F(q,{post:'zacskó,'}),F(r,{post:'szem marad'})],sol:`${q} zacskó, ${r} szem marad`}},
  ()=>{const k=R(2,9);return{q:`Hány nap van ${k} hétben?`,f:[F(7*k,{post:'nap'})]}},
  ()=>{const k=R(2,6),c=R(20,48);return{q:`Az osztálykirándulásra ${k} busz ment, mindegyiken ${c} gyerek utazott. Hány gyerek ment kirándulni?`,f:[F(k*c,{post:'gyerek'})]}},
  ()=>{const N=P(NAMES),a=R(120,350),b=R(30,a-20);return{q:`${N} egy ${a} oldalas könyvet olvas. Már elolvasott ${b} oldalt. Hány oldal van még hátra?`,f:[F(a-b,{post:'oldal'})]}},
  ()=>{let k,p;do{k=R(2,4);p=P([150,180,200,220,250,280])}while(k*p>=1000);const N=P(NAMES);return{q:`${N} a piacon ${k} kg almát vett, egy kilogramm ${p} forintba kerül. 1000 forinttal fizetett. Mennyit kapott vissza?`,f:[F(1000-k*p,{post:'Ft'})]}},
  ()=>{const a=R(5,40);return{q:`Egy négyzet alakú kert egyik oldala ${a} méter. Hány méter kerítés kell, hogy körbekerítsük?`,f:[F(4*a,{post:'m'})]}},
 ],
};

/* ---------- state ---------- */
let selected=new Set(Object.keys(TOPICS)), count=15, problems=[], graded=false, armed=false;
const $=id=>document.getElementById(id);

function loadStats(){try{return JSON.parse(localStorage.getItem('matek3-stats'))||{sheets:0}}catch(e){return{sheets:0}}}
function saveStats(s){try{localStorage.setItem('matek3-stats',JSON.stringify(s))}catch(e){}}
function showStats(){const s=loadStats();$('stats').textContent=s.sheets?`Eddig ${s.sheets} feladatlapot javítottál ki ezen az eszközön.`:''}

function buildChips(){
  const box=$('chips');box.innerHTML='';
  for(const k in TOPICS){const b=document.createElement('button');b.className='chip';b.textContent=TOPICS[k];b.setAttribute('aria-pressed',selected.has(k));
    b.onclick=()=>{selected.has(k)?selected.delete(k):selected.add(k);b.setAttribute('aria-pressed',selected.has(k));
      const none=!selected.size;$('newBtn').disabled=none;$('topicWarn').textContent=none?'Válassz legalább egy témát.':''};
    box.appendChild(b)}
}
$('seg').querySelectorAll('button').forEach(b=>b.onclick=()=>{count=+b.dataset.n;$('seg').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))});

function keyOf(p){return JSON.stringify([p.q,p.col,p.cmp,(p.f||[]).map(f=>[f.pre,f.post])])}
function generate(){
  const order=Object.keys(TOPICS).filter(k=>selected.has(k));
  const picks=shuffle([...order]);const per={};
  for(let i=0;i<count;i++){const t=picks[i%picks.length];per[t]=(per[t]||0)+1}
  const seen=new Set();problems=[];
  for(const t of order){if(!per[t])continue;
    const gens=shuffle([...G[t]]);
    for(let i=0;i<per[t];i++){let p,tries=0;do{p=gens[(i+tries)%gens.length]();tries++}while(seen.has(keyOf(p))&&tries<40);seen.add(keyOf(p));p.topic=t;problems.push(p)}}
  graded=false;armed=false;render();
  $('result').classList.remove('show');$('checkBtn').textContent='Kész vagyok, javítsuk!';$('checkBtn').disabled=false;
  window.scrollTo({top:0});
}

function colHTML(p){
  const A=String(p.col.a),B=String(p.col.b),w=Math.max(A.length,B.length+1,String(p.f[0].ans).length)+0;
  const cells=(s,pad)=>{const arr=s.split('');while(arr.length<pad)arr.unshift('');return arr.map(c=>`<span class="c">${c}</span>`).join('')};
  const opRow=[p.col.op,...(()=>{const a=B.split('');while(a.length<w-1)a.unshift('');return a})()];
  return `<div class="col" style="width:${w*30}px"><div class="r">${cells(A,w)}</div><div class="r under">${opRow.map(c=>`<span class="c">${c}</span>`).join('')}</div><input class="a" data-j="0" inputmode="numeric" autocomplete="off" aria-label="Eredmény"></div>`;
}
function render(){
  const s=$('sheet');s.innerHTML='';let last=null;
  problems.forEach((p,i)=>{
    if(p.topic!==last){const h=document.createElement('h3');h.className='topic';h.textContent=TOPICS[p.topic];s.appendChild(h);last=p.topic}
    const d=document.createElement('div');d.className='prob';d.dataset.i=i;
    let body=p.q?`<p class="q">${p.q}</p>`:'';
    if(p.svg)body+=p.svg;
    if(p.col)body+=colHTML(p);
    else if(p.cmp)body+=`<div class="line"><span class="t">${p.cmp.l}</span><span class="cmp" role="group" aria-label="Jel">${['<','=','>'].map(v=>`<button data-v="${v}" aria-pressed="false">${v==='<'?'&lt;':v==='>'?'&gt;':'='}</button>`).join('')}</span><span class="t">${p.cmp.r}</span></div>`;
    else body+=`<div class="line">${p.f.map((f,j)=>`${f.pre?`<span class="t">${f.pre}</span>`:''}<input class="a${f.roman?' roman':''}" data-j="${j}" ${f.kind==='num'?'inputmode="numeric"':'autocapitalize="characters" autocorrect="off" spellcheck="false"'} autocomplete="off" aria-label="Válasz">${f.post?`<span class="t">${f.post}</span>`:''}`).join('')}</div>`;
    d.innerHTML=`<span class="num">${i+1}.</span><div>${body}<div class="fix"></div></div><span class="mark" aria-hidden="true"></span>`;
    d.querySelectorAll('.cmp button').forEach(b=>b.onclick=()=>{if(graded)return;b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
    s.appendChild(d);
  });
  const ins=[...s.querySelectorAll('input.a')];
  ins.forEach((inp,k)=>inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();(ins[k+1]||$('checkBtn')).focus()}}));
}

const norm=v=>v.replace(/\s+/g,'').toUpperCase();
function isRight(f,v){v=norm(v);if(!v)return false;if(f.kind==='num')return /^\d+$/.test(v)&&Number(v)===f.ans;return v===f.ans}
function solText(p){if(p.cmp)return `${p.cmp.l} ${p.ans} ${p.cmp.r}`;if(p.sol)return p.sol;const f=p.f[0];return f.ans+(f.post&&!/[=<>+·:−&]/.test(f.post)?' '+f.post:'')}
function blanks(){let n=0;document.querySelectorAll('.prob').forEach(d=>{const p=problems[d.dataset.i];if(p.cmp){if(!d.querySelector('[aria-pressed="true"]'))n++}else if([...d.querySelectorAll('input.a')].some(x=>!x.value.trim()))n++});return n}

function check(){
  if(graded){generate();return}
  const b=blanks();
  if(b&&!armed){armed=true;$('checkBtn').textContent=`${b} feladat még üres. Javítsuk így is?`;return}
  let good=0;
  document.querySelectorAll('.prob').forEach(d=>{
    const p=problems[d.dataset.i];let ok;
    if(p.cmp){const sel=d.querySelector('[aria-pressed="true"]');ok=sel&&sel.dataset.v===p.ans;d.querySelectorAll('.cmp button').forEach(x=>x.disabled=true)}
    else{const ins=[...d.querySelectorAll('input.a')];ok=ins.every((x,j)=>isRight(p.f[j],x.value));ins.forEach(x=>x.disabled=true)}
    d.querySelector('.mark').textContent=ok?'✓':'✗';
    if(!ok)d.querySelector('.fix').textContent='Helyesen: '+solText(p);
    if(ok)good++;
  });
  graded=true;
  const pct=good/problems.length,g=pct>=.9?5:pct>=.75?4:pct>=.55?3:pct>=.4?2:1;
  const msg={5:'Szuper munka!',4:'Nagyon ügyes!',3:'Jó úton jársz!',2:'Nézd át a pirosakat!',1:'Gyakoroljunk még!'};
  $('gradeNum').textContent=g;$('resTitle').textContent=msg[g];
  $('resText').textContent=`${good} / ${problems.length} feladat jó. A pirossal javítottaknál ott a helyes válasz.`;
  $('result').classList.add('show');
  $('checkBtn').textContent='Új feladatlap';
  const s=loadStats();s.sheets=(s.sheets||0)+1;saveStats(s);showStats();
  $('result').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});
}

$('checkBtn').onclick=check;
$('newBtn').onclick=generate;
$('againBtn').onclick=generate;
buildChips();showStats();generate();
</script>
